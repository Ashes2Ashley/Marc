name: restore-scraper-studio
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/components/ScraperStudio.tsx.gz.b64.part0'
      - 'src/components/ScraperStudio.tsx.gz.b64.part1'
      - '.github/workflows/restore-scraper-studio.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and decode ScraperStudio.tsx
        run: |
          python3 <<'PY'
          import base64, gzip, pathlib
          p0 = pathlib.Path('src/components/ScraperStudio.tsx.gz.b64.part0').read_text().strip()
          p1 = pathlib.Path('src/components/ScraperStudio.tsx.gz.b64.part1').read_text().strip()
          raw = gzip.decompress(base64.b64decode(p0 + p1))
          out = pathlib.Path('src/components/ScraperStudio.tsx')
          out.write_bytes(raw)
          text = raw.decode()
          assert 'New official source' in text
          assert "targetUrl: ''" in text
          print('restored', len(raw), 'bytes')
          for p in [
            'src/components/ScraperStudio.tsx.gz.b64',
            'src/components/ScraperStudio.tsx.gz.b64.part0',
            'src/components/ScraperStudio.tsx.gz.b64.part1',
            'src/components/_size_canary.tsx',
            'src/components/_b64_encoding_test.txt',
            'src/components/scraperStudioLabels.ts',
          ]:
            fp = pathlib.Path(p)
            if fp.exists():
              fp.unlink()
              print('removed', p)
          PY
      - name: Commit restored file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix: restore ScraperStudio.tsx (New official source polish)" || echo "nothing to commit"
          git push
